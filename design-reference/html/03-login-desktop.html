<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ResumeFit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-background": "#191c1d",
                        "on-error-container": "#93000a",
                        "outline": "#777587",
                        "secondary": "#555f6f",
                        "on-surface-variant": "#464555",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-container": "#006e4b",
                        "secondary-fixed-dim": "#bdc7d9",
                        "tertiary-fixed": "#6ffbbe",
                        "on-secondary-fixed": "#121c2a",
                        "on-primary-container": "#dad7ff",
                        "surface-container-low": "#f3f4f5",

                        "secondary-container": "#d6e0f3",

                    "spacing": {

                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xl": "48px",

                        "margin-desktop": "auto",

                    "fontSize": {

</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center">
<!-- Main Authentication Container -->
<main class="w-full max-w-md px-margin-mobile md:px-0 mx-auto">
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-lg md:p-xl">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="flex justify-center items-center gap-2 mb-sm text-primary">
<span class="material-symbols-outlined text-headline-lg">description</span>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight">ResumeFit</h1>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mt-lg">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Please enter your details to sign in.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email address</label>
<div class="mt-1">
<input autocomplete="email" class="block w-full appearance-none rounded-md border border-outline-variant px-md py-sm placeholder-on-surface-variant/50 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 font-body-sm text-body-sm bg-surface-container-lowest transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<div class="mt-1 relative">
<input autocomplete="current-password" class="block w-full appearance-none rounded-md border border-outline-variant px-md py-sm placeholder-on-surface-variant/50 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 font-body-sm text-body-sm bg-surface-container-lowest transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<div>
<button class="flex w-full justify-center items-center rounded-md bg-primary-container px-md py-sm font-label-md text-label-md text-on-primary hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors shadow-sm" type="submit">
                        Log in
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-surface-container-lowest px-2 font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- Google Auth Button -->
<div class="mt-lg">
<button class="flex w-full items-center justify-center gap-3 rounded-md border border-outline-variant bg-surface-container-lowest px-md py-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors" type="button">
<svg aria-hidden="true" class="h-5 w-5" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26538 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"></path>
</svg>
<span class="text-on-surface">Sign in with Google</span>
</button>
</div>
</div>
</div>
<!-- Footer Link -->
<p class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-md text-label-md text-primary hover:text-primary/80 transition-colors" href="#">Sign up for free</a>
</p>
</main>
</body></html>
