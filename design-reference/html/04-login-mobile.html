<body class="bg-surface flex items-center justify-center min-h-screen px-margin-mobile md:px-margin-desktop text-on-surface">
<!-- Main Content Canvas (Navigation suppressed per Linear/Transactional rule) -->
<main class="w-full max-w-md">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-8 md:p-10 flex flex-col items-center">
<!-- Brand & Header -->
<div class="text-center mb-8 w-full">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight mb-2">ResumeFit</h1>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Sign in to manage your professional identity.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-6">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline focus:outline-none" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 rounded-md flex items-center justify-center gap-2 hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest mt-2" type="submit">
                    Log in
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Action (Google) -->
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-3 rounded-md flex items-center justify-center gap-3 hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="button">
<img alt="" class="w-5 h-5 object-contain" data-alt="A clean, minimalist vector rendering of the Google 'G' logo icon, set against a pure white background. The icon uses standard corporate colors but is styled to fit within a modern, professional light-mode software application context. High resolution, flat design style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNQJT7a1aSqtPqnKzVbPsQTZFPWOUs8ToVeBKaDSrDizoA1kV4gsc_lN9UenOt43GG2eQ0--plV9WHAAgayw9-2cTMiM8JHo4IUuN80tbN7QRF39DJFGaXuDeO-4PKumzKhqtlZSKejiQ-pDy-NE2GSlCMYxDW230rene3riwJ_AUql50qrUA9h9KXCJcTEO5vAscoJpSULS9fi5bN9aZ_p9EuypkurW-mjY-lljG5BLrF2Yc98MoC"/>
                Continue with Google
            </button>
</div>

            <a class="font-label-md text-label-md text-primary hover:underline focus:outline-none ml-1" href="#">Sign up</a>
