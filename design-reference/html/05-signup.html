<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ResumeFit - Sign Up</title>

                      "outline": "#777587",
                      "surface-bright": "#f8f9fa",
                      "inverse-on-surface": "#f0f1f2",

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Screen: Global Navigation Suppressed -->
<main class="w-full max-w-[440px] animate-[fadeIn_0.3s_ease-out]">
<!-- Brand Header -->
<div class="text-center mb-xl">
<a class="inline-block font-headline-md text-headline-md font-bold text-primary tracking-tight mb-md hover:opacity-80 transition-opacity" href="#">
                ResumeFit
            </a>
<h1 class="font-headline-md text-headline-md text-on-surface">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Start optimizing your career documents today.</p>
</div>
<!-- Main Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg md:p-xl">
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="name">Full Name</label>
<input class="w-full rounded-md border border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all duration-200" id="name" name="name" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full rounded-md border border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full rounded-md border border-outline-variant bg-surface px-4 py-3 pr-10 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Must be at least 8 characters.</p>
</div>
<!-- Primary Submit Button -->
<button class="w-full flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-md hover:bg-primary/90 focus:ring-4 focus:ring-primary/30 focus:outline-none transition-all duration-200 mt-sm" type="submit">
                    Sign up
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">Or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Social Button -->
<button class="w-full flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-3 px-4 rounded-md hover:bg-surface-container transition-colors duration-200 focus:ring-2 focus:ring-outline focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Footer Link -->
<div class="text-center mt-lg font-body-sm text-body-sm text-on-surface-variant">
            Already have an account? 
            <a class="font-label-md text-label-md text-primary hover:underline underline-offset-2 transition-all" href="#">
                Log in
            </a>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
